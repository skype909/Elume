<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, noarchive">
    <title>We’ll be right back · Elume</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 16% 12%, rgba(20, 184, 166, .15), transparent 31rem),
          radial-gradient(circle at 87% 88%, rgba(124, 58, 237, .10), transparent 27rem),
          #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 620px); }
      .card {
        overflow: hidden;
        border: 1px solid #dbeafe;
        border-radius: 28px;
        background: rgba(255, 255, 255, .97);
        box-shadow: 0 24px 64px rgba(15, 23, 42, .12);
      }
      .accent { height: 7px; background: linear-gradient(90deg, #059669, #0d9488 58%, #7c3aed); }
      .content { padding: clamp(32px, 7vw, 56px); }
      .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 800; letter-spacing: .03em; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #059669, #06b6d4); box-shadow: 0 8px 18px rgba(5, 150, 105, .25); color: white; font-size: 1.1rem; }
      .eyebrow { margin: 42px 0 10px; color: #0f766e; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.3rem); letter-spacing: -.045em; line-height: 1.06; }
      p { max-width: 48ch; margin: 18px 0 0; color: #475569; font-size: 1.05rem; line-height: 1.65; }
      .actions { margin-top: 32px; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #059669;
        padding: 12px 20px;
        color: white;
        font-weight: 750;
        text-decoration: none;
        box-shadow: 0 8px 18px rgba(5, 150, 105, .2);
      }
      a:hover { background: #047857; }
      a:focus-visible { outline: 3px solid #8b5cf6; outline-offset: 4px; }
      .footer { margin-top: 34px; color: #64748b; font-size: .88rem; }
      @media (max-width: 480px) { body { padding: 16px; } .content { padding: 30px 26px; } .eyebrow { margin-top: 32px; } a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="accent"></div>
        <div class="content">
          <div class="brand" aria-label="Elume"><span class="mark" aria-hidden="true">E</span><span>ELUME</span></div>
          <p class="eyebrow">Temporarily unavailable</p>
          <h1 id="page-title">We’ll be right back</h1>
          <p>Elume is temporarily unavailable. Please try again in a few minutes.</p>
          <div class="actions"><a href="/">Try again</a></div>
          <div class="footer">Thanks for your patience.</div>
        </div>
      </section>
    </main>
  </body>
</html>
